<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cvl Player V6</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        body { background: #050505; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .movie-card { transition: 0.3s; cursor: pointer; text-align: center; }
        .movie-card img { width: 100%; border-radius: 10px; }
        .movie-card:hover { transform: scale(1.1); }
        #player-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; z-index: 100; }
        .close-btn { position: absolute; top: 20px; left: 20px; z-index: 101; background: red; color: white; border: none; padding: 15px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>
    <h2>المكتبة الشاملة (أفلام وأنِمي)</h2>
    <div class="grid" id="movieGrid"></div>

    <div id="player-container">
        <button class="close-btn" onclick="closePlayer()">X</button>
        <video id="vid" class="video-js vjs-fluid vjs-default-skin" controls preload="auto"></video>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        const player = videojs('vid');

        async function loadMovies() {
            const res = await fetch('/api/movies/movie');
            const movies = await res.json();
            const grid = document.getElementById('movieGrid');
            movies.forEach(movie => {
                const div = document.createElement('div');
                div.className = 'movie-card';
                div.innerHTML = `<img src="${movie.poster}"><p>${movie.name}</p>`;
                div.onclick = () => playMovie(movie.imdb_id, 'movie');
                grid.appendChild(div);
            });
        }

        async function playMovie(id, type) {
            const res = await fetch(`https://torrentio.strem.fun/stream/${type}/${id}.json`);
            const data = await res.json();
            if (data.streams) {
                const magnet = data.streams[0].infoHash;
                document.getElementById('player-container').style.display = 'block';
                player.src({ type: 'video/mp4', src: `/video?magnet=${encodeURIComponent('magnet:?xt=urn:btih:'+magnet)}` });
                player.play();
            }
        }

        function closePlayer() {
            player.pause();
            document.getElementById('player-container').style.display = 'none';
        }
        loadMovies();
    </script>
</body>
</html>
